<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Futurix - 3D Car Showcase</title>

    <!-- Preconnect to font CDN (reduces DNS/TLS latency) -->
    <link rel="preconnect" href="https://api.fontshare.com" crossorigin />

    <!-- Critical font preloads (only the ones needed above the fold) -->
    <link rel="preload" href="/fonts/Conthrax-SemiBold.otf" as="font" type="font/otf" crossorigin="anonymous" />

    <!-- Non-blocking external fonts (swap ensures text is visible immediately) -->
    <link
      rel="preload"
      as="style"
      href="https://api.fontshare.com/v2/css?f[]=archivo@400,500,600,700&f[]=clash-display@600&display=swap"
      onload="this.onload=null;this.rel='stylesheet'"
    />
    <noscript>
      <link href="https://api.fontshare.com/v2/css?f[]=archivo@400,500,600,700&f[]=clash-display@600&display=swap" rel="stylesheet" />
    </noscript>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
